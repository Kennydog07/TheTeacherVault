<script>
(function(){
  "use strict";
  document.getElementById("heroMascotWrap").innerHTML = EY.mascot("point-right", "The Teacher Vault mascot pointing at the debugging activity", { size: 90, animate: "float" });

  CQRobot.mount(document.getElementById("gameRoot"), {
    levels: CQ_LEVELS.bug,
    commands: ["F", "L", "R"],
    requirePredict: true,
    onAllComplete: function () { CQ.markComplete("find-the-bug"); }
  });

  document.getElementById("practisingList").innerHTML =
    "<li>" + CQ.term("Predict") + "ing what a program will do before running it</li>" +
    "<li>Spotting a " + CQ.term("Bug") + " &mdash; a mistake that makes a program do the wrong thing</li>" +
    "<li>" + CQ.term("Debug") + "ging a program: fixing the mistake</li>" +
    "<li>" + CQ.term("Test") + "ing your fix to make sure it really works</li>";

  document.getElementById("curricWrap").innerHTML = CQ.curriculumConnection({
    statements: [
      "Understand what algorithms are; how they are implemented as programs on digital devices; and that programs execute by following precise and unambiguous instructions",
      "Create and debug simple programs",
      "Use logical reasoning to predict the behaviour of simple programs"
    ],
    skills: ["Predicting the outcome of an existing program", "Running a program to test a prediction", "Identifying which step causes a fault", "Correcting a program and re-testing it"],
    year: "Year 1 or Year 2",
    time: "15-20 minutes",
    level: "core",
    success: [
      "Makes a prediction before running each buggy program",
      "Can point to (or describe) which step is wrong after seeing the robot fail",
      "Successfully fixes and re-tests the program until it reaches the flag"
    ],
    discuss: "How could you tell the program had a bug, just by predicting first?",
    followUp: "Write down (or say aloud) a short set of directions for a simple task, such as making a sandwich, then deliberately swap two steps and ask a grown-up to spot your bug."
  });
})();
</script>
