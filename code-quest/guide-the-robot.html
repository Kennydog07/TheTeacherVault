<script>
(function(){
  "use strict";
  document.getElementById("heroMascotWrap").innerHTML = EY.mascot("point-right", "The Teacher Vault mascot pointing at the robot activity", { size: 90, animate: "float" });

  CQRobot.mount(document.getElementById("gameRoot"), {
    levels: CQ_LEVELS.guide,
    commands: ["F", "L", "R"],
    requirePredict: true,
    onAllComplete: function () { CQ.markComplete("guide-the-robot"); }
  });

  document.getElementById("practisingList").innerHTML =
    "<li>Giving the robot exact, step-by-step " + CQ.term("Instruction") + "s</li>" +
    "<li>Putting " + CQ.term("Command") + "s in the right order</li>" +
    "<li>" + CQ.term("Predict") + "ing what will happen before you run your program</li>" +
    "<li>Changing your program when it doesn't do what you expected</li>";

  document.getElementById("curricWrap").innerHTML = CQ.curriculumConnection({
    statements: [
      "Understand what algorithms are; how they are implemented as programs on digital devices; and that programs execute by following precise and unambiguous instructions",
      "Create and debug simple programs",
      "Use logical reasoning to predict the behaviour of simple programs"
    ],
    skills: ["Sequencing instructions", "Predicting outcomes before testing", "Comparing a prediction with a real result", "Amending a program that does not work as intended"],
    year: "Year 1 or Year 2",
    time: "15-20 minutes",
    level: "core",
    success: [
      "Predicts an end position before pressing Run, on more than one level",
      "Builds a short, correctly-ordered sequence of Forward/Turn commands that reaches the flag",
      "Changes their program (rather than giving up) when the robot does not reach the flag"
    ],
    discuss: "What happened when your guess was wrong? What did that tell you?",
    followUp: "Away from the screen, take turns giving a grown-up or another child exact walking directions (e.g. \"three steps forward, turn right\") around the room, and see if precise instructions get them to the right spot."
  });
})();
</script>
