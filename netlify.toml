[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/cliff-notes.html"
  to = "/quick-notes"
  status = 301

[[redirects]]
  from = "/revision.html"
  to = "/student-apps"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
