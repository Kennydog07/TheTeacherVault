<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lesson Planner &mdash; Free | The Teacher Vault</title>
<style>
  :root {
    --green: #2d5a3d;
    --green-mid: #3d7a52;
    --green-light: #e8f2eb;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --text: #1a2e22;
    --text-muted: #4a6355;
    --border: rgba(0,0,0,0.12);
    --bg: #ffffff;
    --surface: #f7f9f7;
    --radius: 14px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e8f2eb; --text-muted: #8aaa96;
      --border: rgba(255,255,255,0.12);
      --bg: #131a15; --surface: #1c2a1f;
      --green-light: #1c2a1f; --teal-light: #04342C;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui,-apple-system,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: #2a4a35;
    background-image:
      repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(255,255,255,0.015) 28px,rgba(255,255,255,0.015) 29px),
      repeating-linear-gradient(90deg,transparent,transparent 28px,rgba(255,255,255,0.015) 28px,rgba(255,255,255,0.015) 29px);
    border-bottom: 6px solid #8B6914;
    padding: 1.2rem 1.5rem 1rem;
    display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative;
  }
  header img { max-height: 110px; max-width: 300px; object-fit: contain; }
  .logo-tag { font-size: .75rem; color: rgba(245,242,234,.65); margin-top: 6px; letter-spacing: 1px; }
  .ver-badge { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #f5f2ea; font-size: .68rem; font-weight: 700; letter-spacing: 1.2px; }
  footer a.footer-link { display: inline-block; margin-top: 8px; color: var(--green-mid); font-weight: 600; text-decoration: none; }
  footer a.footer-link:hover { text-decoration: underline; }
  .chalk-tray { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #8B6914; display: flex; align-items: center; padding: 0 1.5rem; gap: 8px; }
  .chalk-piece { width: 36px; height: 8px; background: #f0ece0; border-radius: 2px; margin-top: -5px; opacity: .9; }
  main { flex: 1; max-width: 680px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.4rem; margin-bottom: 1.1rem; }
  .card h2 { font-size: .95rem; font-weight: 700; color: var(--green); margin-bottom: 1rem; display: flex; align-items: center; gap: 7px; text-transform: uppercase; letter-spacing: .5px; }
  @media (prefers-color-scheme: dark) { .card h2 { color: #9FE1CB; } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  @media(max-width:480px) { .grid2 { grid-template-columns: 1fr; } }
  label { display: block; font-size: .73rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 9px 12px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: .93rem; font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--green-mid); box-shadow: 0 0 0 3px rgba(45,90,61,.12); }
  textarea { resize: vertical; min-height: 65px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .chip { padding: 5px 13px; border-radius: 999px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text-muted); font-size: .8rem; cursor: pointer; transition: all .15s; user-select: none; }
  .chip.active { background: var(--green-light); border-color: var(--green-mid); color: var(--green); font-weight: 700; }
  @media (prefers-color-scheme: dark) { .chip.active { color: #9FE1CB; background: #1c3525; border-color: #3d7a52; } }
  .btn { width: 100%; padding: 13px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .15s, transform .1s; }
  .btn:hover { background: #1e3d2a; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-outline { background: transparent; border: 0.5px solid var(--border); color: var(--text-muted); font-size: .83rem; padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all .15s; }
  .btn-outline:hover { border-color: var(--green-mid); color: var(--green); background: var(--green-light); }
  #output { display: none; margin-top: 1.4rem; }
  .section-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--text-muted); margin-bottom: 4px; }
  .plan-block { background: var(--bg); border: 0.5px solid var(--border); border-left: 3px solid var(--green-mid); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: .85rem 1rem; margin-bottom: .8rem; font-size: .92rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .73rem; font-weight: 700; }
  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-teal { background: var(--teal-light); color: #085041; }
  @media (prefers-color-scheme: dark) { .badge-green { color: #9FE1CB; background: #1c3525; } .badge-teal { color: #9FE1CB; } }
  .meta-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 1rem; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { background: #FCEBEB; border: 0.5px solid #F09595; border-radius: var(--radius-sm); color: #A32D2D; padding: 11px 14px; font-size: .88rem; margin-top: .75rem; }
  footer { text-align: center; font-size: .75rem; color: var(--text-muted); padding: 1rem; border-top: 0.5px solid var(--border); }
  @media print { header, footer, .btn, .btn-outline { display: none !important; } body { background: #fff; color: #000; } .plan-block { border-left: 3px solid #2d5a3d; } }
</style>
</head>

<main>
  <div class="card">
    <h2>📚 Lesson Details</h2>
    <div class="grid2" style="margin-bottom:11px">
      <div><label>Subject</label><input id="subject" type="text" placeholder="e.g. Science, English, Maths"/></div>
      <div><label>Topic</label><input id="topic" type="text" placeholder="e.g. Photosynthesis, WW2"/></div>
    </div>
    <div class="grid2" style="margin-bottom:11px">
      <div><label>Grade / Year Level</label><input id="grade" type="text" placeholder="e.g. Grade 5, Year 8"/></div>
      <div><label>Lesson Duration</label>
        <select id="duration">
          <option>30 minutes</option>
          <option>45 minutes</option>
          <option selected>60 minutes</option>
          <option>90 minutes</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:11px">
      <label>Learning Style</label>
      <div class="chips">
        <span class="chip active" data-val="mixed">Mixed</span>
        <span class="chip" data-val="visual">Visual</span>
        <span class="chip" data-val="hands-on">Hands-on</span>
        <span class="chip" data-val="discussion">Discussion</span>
        <span class="chip" data-val="independent">Independent</span>
      </div>
    </div>
    <div><label>Extra Notes (optional)</label>
      <textarea id="notes" placeholder="e.g. Include a group activity, ESL learners, focus on critical thinking..."></textarea>
    </div>
  </div>

  <button class="btn" id="generateBtn" onclick="generate()">✨ Generate Lesson Plan</button>
  <div id="errorMsg"></div>

  <div id="output">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem">
        <span class="section-label">📋 Your Lesson Plan</span>
        <div style="display:flex;gap:7px">
          <button class="btn-outline" onclick="copyPlan()">Copy</button>
          <button class="btn-outline" onclick="window.print()">Print</button>
        </div>
      </div>
      <div class="meta-row" id="metaBadges"></div>
      <div id="planContent"></div>
    </div>
    <button class="btn" style="background:var(--teal)" onclick="reset()">➕ Plan Another Lesson</button>
  </div>
</main>

<footer>The Teacher Vault — saving teachers time, one lesson at a time 🍎<br/><a class="footer-link" href="/lesson-planner.html">Need worksheets, quizzes &amp; homework too? Try Lesson Planner Pro →</a></footer>

<script>
  const chips = document.querySelectorAll('.chip');
  chips.forEach(c => c.addEventListener('click', () => {
    chips.forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  }));

  function getSelectedStyle() {
    const active = document.querySelector('.chip.active');
    return active ? active.dataset.val : 'mixed';
  }

  const SECTIONS = [
    { key: 'objectives',      label: '🎯 Learning Objectives' },
    { key: 'materials',       label: '🛒 Materials Needed' },
    { key: 'hook',            label: '🪝 Opener / Hook' },
    { key: 'main',            label: '📖 Main Activity' },
    { key: 'assessment',      label: '✅ Assessment' },
    { key: 'closure',         label: '🔚 Closure' },
    { key: 'homework',        label: '🏠 Homework / Extension' },
    { key: 'differentiation', label: '♿ Differentiation Tips' },
  ];

  /* ------------------------------------------------------------------
     Local lesson-plan generator. Runs entirely in the browser -- no
     server call. Template banks give real variety between generations
     rather than the same fixed wording every time; duration and
     learning style genuinely change the suggested activity.
     ------------------------------------------------------------------ */
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  const OBJECTIVE_VERBS = ['identify', 'explain', 'describe', 'recognise', 'outline', 'understand'];
  const STRETCH_VERBS = ['analyse', 'apply', 'evaluate', 'justify', 'compare', 'explain in depth'];

  const MATERIALS_BY_STYLE = {
    mixed: ['Whiteboard and pens', 'Pupil exercise books', 'Printed task sheet', 'Visual prompt or slide related to the topic'],
    visual: ['Whiteboard or projector for diagrams', 'Coloured pens for annotating', 'Visual prompt or diagram of the topic', 'Pupil exercise books'],
    'hands-on': ['Practical resources or manipulatives for the topic', 'Task cards', 'Pupil exercise books', 'Timer for activity rounds'],
    discussion: ['Discussion prompt cards', 'Talk-partner seating (no extra resources needed)', 'Whiteboard for capturing ideas', 'Pupil exercise books'],
    independent: ['Independent task sheet', 'Pupil exercise books', 'Success criteria displayed on the board']
  };

  const HOOK_TEMPLATES = [
    c => `Show pupils a picture, object or short clip connected to ${c.topic} and ask: what do you notice? What questions come to mind?`,
    c => `Quick-fire recall: ask three rapid questions linking back to what pupils already know before starting ${c.topic}.`,
    c => `Pose a big question about ${c.topic} and give pupils sixty seconds to jot down their first thoughts.`,
    c => `Show two contrasting examples related to ${c.topic} and ask pupils to spot the difference.`,
    c => `Start with a quick true-or-false round using three statements about ${c.topic}.`
  ];

  const MAIN_TEMPLATES = {
    mixed: [
      c => `Introduce ${c.topic} with a short explanation, then move into guided practice where pupils work through examples together before trying one independently.`,
      c => `Alternate between brief teacher input on ${c.topic} and short paired tasks, checking understanding at each step.`
    ],
    visual: [
      c => `Use a diagram or visual model to break down ${c.topic}, then ask pupils to sketch or annotate their own version.`,
      c => `Present ${c.topic} through a labelled diagram, building it up step by step with pupil input.`
    ],
    'hands-on': [
      c => `Pupils work through a hands-on task exploring ${c.topic}, using materials or resources directly rather than just being told about it.`,
      c => `Set up a practical activity where pupils investigate ${c.topic} and record what they find.`
    ],
    discussion: [
      c => `Pupils discuss ${c.topic} in pairs or small groups, working through a set of guided questions before feeding back to the class.`,
      c => `Run a structured discussion or debate on ${c.topic}, with pupils building an argument using evidence.`
    ],
    independent: [
      c => `Pupils work independently through a task on ${c.topic}, using success criteria to self-check their progress.`,
      c => `Set pupils an independent challenge on ${c.topic}, circulating to support pupils who need it.`
    ]
  };

  const ASSESSMENT_TEMPLATES = [
    c => `Mini whiteboards: pupils show their answer to a quick question on ${c.topic} on the count of three.`,
    c => `Thumbs up/down check: pupils rate their own confidence with ${c.topic} so far.`,
    c => `Exit ticket: pupils write one thing they've learned about ${c.topic} and one question they still have.`,
    c => `Cold-call two or three pupils to explain a key point about ${c.topic} in their own words.`
  ];

  const CLOSURE_TEMPLATES = [
    c => `Ask two or three pupils to summarise one key point about ${c.topic} in their own words.`,
    c => `Quick round-up: what's one thing you'll remember about ${c.topic} tomorrow?`,
    c => `Link back to today's objective and ask pupils to rate how confident they now feel.`,
    c => `End with a one-sentence summary written on mini whiteboards and held up together.`
  ];

  const HOMEWORK_TEMPLATES = [
    c => `Find one real-world example connected to ${c.topic} and be ready to share it next lesson.`,
    c => `Complete a short follow-up task consolidating ${c.topic}, to be checked at the start of next lesson.`,
    c => `Extension: research one further question about ${c.topic} you'd like answered.`
  ];

  const SUPPORT_TEMPLATES = [
    c => `Provide sentence starters or a writing frame for pupils who need extra support with ${c.topic}.`,
    c => `Pair less confident pupils with a supportive partner for the main task.`,
    c => `Break the task on ${c.topic} into smaller, clearly sequenced steps.`
  ];

  const STRETCH_TEMPLATES = [
    c => `Challenge confident pupils to explain ${c.topic} to someone else in their own words.`,
    c => `Offer an extension question that asks pupils to apply ${c.topic} to a new, unfamiliar example.`,
    c => `Ask confident pupils to justify their reasoning rather than just giving an answer.`
  ];

  function buildLessonPlan(input) {
    const c = { subject: input.subject, topic: escapeHtml(input.topic), grade: input.grade, duration: input.duration, style: input.style, notes: input.notes };
    const style = MATERIALS_BY_STYLE[c.style] ? c.style : 'mixed';
    const mainBank = MAIN_TEMPLATES[style] || MAIN_TEMPLATES.mixed;

    const objectives = `<ul><li>Pupils will be able to ${pick(OBJECTIVE_VERBS)} ${c.topic}.</li>` +
      `<li>More confident pupils will be able to ${pick(STRETCH_VERBS)} their understanding of ${c.topic}.</li></ul>`;

    const materials = `<ul>${MATERIALS_BY_STYLE[style].map(m => `<li>${m}</li>`).join('')}</ul>`;

    const hook = `<p>${pick(HOOK_TEMPLATES)(c)}</p>`;

    let mainText = pick(mainBank)(c);
    if (c.duration === '90 minutes') {
      mainText += ' With the extra time, split this into two linked tasks with a short break or check-in between them.';
    } else if (c.duration === '30 minutes') {
      mainText += ' Keep this focused and move on promptly — there is limited time in this session.';
    }
    const main = `<p>${mainText}</p>`;

    const assessment = `<p>${pick(ASSESSMENT_TEMPLATES)(c)}</p>`;
    const closure = `<p>${pick(CLOSURE_TEMPLATES)(c)}</p>`;
    const homework = `<p>${pick(HOMEWORK_TEMPLATES)(c)}</p>`;

    let differentiation = `<ul><li>${pick(SUPPORT_TEMPLATES)(c)}</li><li>${pick(STRETCH_TEMPLATES)(c)}</li></ul>`;
    if (c.notes) {
      differentiation += `<p><strong>Extra context noted:</strong> ${escapeHtml(c.notes)}</p>`;
    }

    return { objectives, materials, hook, main, assessment, closure, homework, differentiation };
  }

  async function generate() {
    const subject  = document.getElementById('subject').value.trim();
    const topic    = document.getElementById('topic').value.trim();
    const grade    = document.getElementById('grade').value.trim();
    const duration = document.getElementById('duration').value;
    const notes    = document.getElementById('notes').value.trim();

    if (!subject || !topic || !grade) {
      document.getElementById('errorMsg').innerHTML =
        '<div class="error-msg">Please fill in Subject, Topic, and Grade level.</div>';
      return;
    }
    document.getElementById('errorMsg').innerHTML = '';
    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Generating your plan...';
    document.getElementById('output').style.display = 'none';

    try {
      await new Promise(r => setTimeout(r, 350));
      const plan = buildLessonPlan({ subject, topic, grade, duration, style: getSelectedStyle(), notes });

      document.getElementById('metaBadges').innerHTML =
        `<span class="badge badge-green">${escapeHtml(subject)}</span>
         <span class="badge badge-green">${escapeHtml(topic)}</span>
         <span class="badge badge-teal">${escapeHtml(grade)}</span>
         <span class="badge badge-teal">${duration}</span>
         <span class="badge badge-teal">${getSelectedStyle()}</span>`;

      document.getElementById('planContent').innerHTML = SECTIONS
        .filter(s => plan[s.key])
        .map(s => `<div class="section-label">${s.label}</div><div class="plan-block">${plan[s.key]}</div>`)
        .join('');

      document.getElementById('output').style.display = 'block';
      document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch(e) {
      document.getElementById('errorMsg').innerHTML =
        '<div class="error-msg">Something went wrong: ' + e.message + '</div>';
    }
    btn.disabled = false;
    btn.innerHTML = '✨ Generate Lesson Plan';
  }

  function copyPlan() {
    const labels = [...document.querySelectorAll('.section-label')].map(el => el.innerText);
    const blocks = [...document.querySelectorAll('.plan-block')].map(el => el.innerText);
    const text = labels.map((l, i) => `${l}\n${blocks[i] || ''}`).join('\n\n');
    navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
  }

  function reset() {
    document.getElementById('output').style.display = 'none';
    ['subject','topic','grade','notes'].forEach(id => document.getElementById(id).value = '');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
