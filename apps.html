<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse All — The Teacher Vault</title>
<meta name="description" content="Search and filter every app in The Teacher Vault library — free teacher tools, Pro upgrades, free student apps and Quick Notes study guides, all in one place.">
<link rel="canonical" href="https://theteachervault.com/apps.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Browse All — The Teacher Vault">
<meta property="og:description" content="Search and filter every app in The Teacher Vault library.">
<meta property="og:image" content="https://theteachervault.com/images/logo.png">
<meta property="og:url" content="https://theteachervault.com/apps.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Browse All — The Teacher Vault">
<meta name="twitter:description" content="Search and filter every app in The Teacher Vault library.">
<meta name="twitter:image" content="https://theteachervault.com/images/logo.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="apps">
<div class="chalk-texture" aria-hidden="true"></div>
<a class="sr-only" href="#main">Skip to main content</a>

<header class="site-header" id="site-header"></header>

<main id="main">

  <section class="section" style="padding-bottom:20px;">
    <div class="container">
      <p class="breadcrumb" id="pageBreadcrumb"><a href="index.html">Home</a> / Browse All</p>
      <span class="eyebrow" id="pageEyebrow">The full library</span>
      <h1 id="pageHeading">Browse All</h1>
      <p class="lede" id="pageLede">Every teacher tool, student app and Quick Notes guide in The Teacher Vault, in one place. Search by name, subject or who it's for — or filter by type, tier and subject.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">

      <form class="filter-bar" id="filterForm" role="search">
        <div class="search-input-wrap" id="searchInputWrap">
          <label for="searchInput" class="sr-only">Search The Teacher Vault</label>
          <span aria-hidden="true" id="searchIcon"></span>
          <input type="search" id="searchInput" class="search-input" placeholder="Search The Teacher Vault&hellip;">
        </div>

        <div class="filter-groups">
          <div class="filter-group" data-group="category">
            <span class="filter-group__label">Type</span>
            <div class="filter-group__options">
              <button type="button" class="chip" data-value="all" aria-pressed="true">All</button>
              <button type="button" class="chip" data-value="teacher" aria-pressed="false">Teacher Tools</button>
              <button type="button" class="chip" data-value="revision" aria-pressed="false">Student</button>
              <button type="button" class="chip" data-value="quicknotes" aria-pressed="false">Quick Notes</button>
            </div>
          </div>

          <div class="filter-group" data-group="tier">
            <span class="filter-group__label">Tier</span>
            <div class="filter-group__options">
              <button type="button" class="chip" data-value="all" aria-pressed="true">All</button>
              <button type="button" class="chip" data-value="free" aria-pressed="false">Free</button>
              <button type="button" class="chip" data-value="lite" aria-pressed="false">Lite</button>
              <button type="button" class="chip" data-value="pro" aria-pressed="false">Pro</button>
            </div>
          </div>

          <div class="filter-group" style="max-width:260px;">
            <label class="filter-group__label" for="subjectSelect">Subject</label>
            <select id="subjectSelect" class="search-input" style="border-radius:var(--radius-sm);">
              <option value="all">All subjects</option>
            </select>
          </div>
        </div>
      </form>

      <p class="results-count" id="resultsCount" aria-live="polite"></p>
      <div class="card-grid" id="allAppsGrid"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="apps-data.js"></script>
<script src="script.js"></script>
<script>
  var state = { q: "", category: "all", tier: "all", subject: "all" };

  var params = new URLSearchParams(window.location.search);
  if (params.get("category")) state.category = params.get("category");
  if (params.get("tier")) state.tier = params.get("tier");
  if (params.get("subject")) state.subject = params.get("subject");
  if (params.get("q")) state.q = params.get("q");

  document.getElementById("searchInput").value = state.q;
  document.getElementById("searchIcon").innerHTML = ICONS.search;

  var subjectSelect = document.getElementById("subjectSelect");
  subjectSelect.innerHTML += SUBJECT_LIST.map(function (s) {
    return '<option value="' + s + '">' + s + '</option>';
  }).join("");
  subjectSelect.value = state.subject;

  /* If the page was reached via a specific tier link (Pro Apps, Free Apps),
     show a heading for that tier instead of the generic "Browse All" one. */
  var TIER_PAGE_INFO = {
    pro: { title: "Pro Apps", eyebrow: "Premium tools", lede: "Every Pro upgrade in The Teacher Vault — purchased individually through Gumroad, never bundled with the Lite version." },
    free: { title: "Free Apps", eyebrow: "No cost, no catch", lede: "Every free app in The Teacher Vault — Lite teacher tools, student apps and Quick Notes guides, all £0." },
    lite: { title: "Lite Apps", eyebrow: "Free, no catch", lede: "Every free Lite teacher tool in The Teacher Vault, downloaded through Gumroad." }
  };
  var tierInfo = params.get("tier") && !params.get("category") && !params.get("subject") && !params.get("q") ? TIER_PAGE_INFO[params.get("tier")] : null;
  if (tierInfo) {
    document.title = tierInfo.title + " — The Teacher Vault";
    document.getElementById("pageBreadcrumb").innerHTML = '<a href="index.html">Home</a> / ' + tierInfo.title;
    document.getElementById("pageEyebrow").textContent = tierInfo.eyebrow;
    document.getElementById("pageHeading").textContent = tierInfo.title;
    document.getElementById("pageLede").textContent = tierInfo.lede;
  }

  /* The Pro Apps view is a short, fixed list — no search or filters needed. */
  if (params.get("tier") === "pro") {
    document.getElementById("filterForm").hidden = true;
  }

  function syncChips() {
    document.querySelectorAll(".filter-group").forEach(function (group) {
      var key = group.getAttribute("data-group");
      group.querySelectorAll(".chip").forEach(function (chip) {
        chip.setAttribute("aria-pressed", chip.getAttribute("data-value") === state[key] ? "true" : "false");
      });
    });
  }

  function applyFilters() {
    var q = state.q.trim().toLowerCase();
    var results = APPS.filter(function (app) {
      if (state.category !== "all" && app.category !== state.category) return false;
      if (state.tier !== "all" && app.tier !== state.tier) return false;
      if (state.subject !== "all" && app.subject !== state.subject) return false;
      if (q) {
        var haystack = (
          app.title + " " + app.tagline + " " + app.description + " " +
          app.subject + " " + app.audience + " " + categoryLabel(app)
        ).toLowerCase();
        if (haystack.indexOf(q) === -1) return false;
      }
      return true;
    });

    document.getElementById("resultsCount").textContent =
      results.length + (results.length === 1 ? " app found" : " apps found");
    renderCardGrid(document.getElementById("allAppsGrid"), results);
  }

  document.querySelectorAll(".filter-group").forEach(function (group) {
    var key = group.getAttribute("data-group");
    group.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        state[key] = chip.getAttribute("data-value");
        syncChips();
        applyFilters();
      });
    });
  });

  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.q = e.target.value;
    applyFilters();
  });

  subjectSelect.addEventListener("change", function (e) {
    state.subject = e.target.value;
    applyFilters();
  });

  document.getElementById("filterForm").addEventListener("submit", function (e) {
    e.preventDefault();
  });

  syncChips();
  applyFilters();
</script>
</body>
</html>
